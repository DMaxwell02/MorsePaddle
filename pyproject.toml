[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-paddle"
version = "0.1.0"
description = "Morse Paddle USB interface VBand diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0.post4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
morse-paddle = "morse_paddle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

